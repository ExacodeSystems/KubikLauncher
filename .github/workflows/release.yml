name: Build Application and Make Release

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      # Required for Azure Trusted Signing
      id-token: write
      # Required for vcpkg binary cache
      packages: write
    with:
      build-type: Release
      environment: Release
    secrets: inherit

  create_release:
    needs: build_release
    permissions:
      contents: write
    runs-on: ubuntu-slim
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "true"
          path: "KubikLauncher-source"
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Grab and store version
        run: |
          tag_name=$(echo ${{ github.ref }} | grep -oE "[^/]+$")
          echo "VERSION=$tag_name" >> $GITHUB_ENV
      - name: Package artifacts properly
        run: |
          mv ${{ github.workspace }}/KubikLauncher-source KubikLauncher-${{ env.VERSION }}
          mv KubikLauncher-Linux-Qt6-Portable*/KubikLauncher-portable.tar.gz KubikLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv KubikLauncher-*.AppImage/KubikLauncher-*-x86_64.AppImage KubikLauncher-Linux-x86_64.AppImage
          mv KubikLauncher-*.AppImage.zsync/KubikLauncher-*-x86_64.AppImage.zsync KubikLauncher-Linux-x86_64.AppImage.zsync
          mv KubikLauncher-macOS*/KubikLauncher.zip KubikLauncher-macOS-${{ env.VERSION }}.zip
          mv KubikLauncher-macOS*/KubikLauncher.dmg KubikLauncher-macOS-${{ env.VERSION }}.dmg

          tar --exclude='.git' -czf KubikLauncher-${{ env.VERSION }}.tar.gz KubikLauncher-${{ env.VERSION }}

          for d in KubikLauncher-Windows-MSVC*; do
            cd "${d}" || continue
            LEGACY="$(echo -n ${d} | grep -o Legacy || true)"
            ARM64="$(echo -n ${d} | grep -o arm64 || true)"
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="KubikLauncher-Windows-MSVC"
            test -z "${LEGACY}" || NAME="${NAME}-Legacy"
            test -z "${ARM64}" || NAME="${NAME}-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv KubikLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref }}
          name: KubikLauncher ${{ env.VERSION }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            KubikLauncher-Linux-x86_64.AppImage
            KubikLauncher-Linux-x86_64.AppImage.zsync
            KubikLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
            KubikLauncher-Windows-MSVC-${{ env.VERSION }}.zip
            KubikLauncher-Windows-MSVC-Portable-${{ env.VERSION }}.zip
            KubikLauncher-Windows-MSVC-Setup-${{ env.VERSION }}.exe
            KubikLauncher-macOS-${{ env.VERSION }}.zip
            KubikLauncher-macOS-${{ env.VERSION }}.dmg
            KubikLauncher-${{ env.VERSION }}.tar.gz
